[project]
name = "rollo-code"
version = "0.1.0"
description = "A local coding agent with a replayable event runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[project.scripts]
rollo = "rollo.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
